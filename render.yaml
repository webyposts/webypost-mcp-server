# Render Blueprint — permanent public MCP URL for Grok
# https://dashboard.render.com → New → Blueprint → connect this repo
services:
  - type: web
    name: webypost-mcp-server
    runtime: node
    plan: free
    region: oregon
    # NODE_ENV=production skips devDependencies; install types + tsc explicitly
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # PORT is set automatically by Render
      - key: WEBYPOST_BASE_URL
        value: https://webypost.com
      # Multi-account JSON — set real emails/passwords in the dashboard (secret)
      - key: WEBYPOST_ACCOUNTS
        sync: false
      - key: WEBYPOST_DEFAULT_ACCOUNT
        sync: false
      - key: WEBYPOST_DEFAULT_PRIVACY
        value: Public
